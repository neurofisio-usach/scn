<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Página no listada: que los buscadores no la indexen -->
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Galería · Sociedad Chilena de Neurociencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lexend:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15181c;
    --panel: #1e2227;
    --text: #eef0f2;
    --muted: #9aa3ad;
    --accent: #5fb3c9;
    --f-display: "Lexend", system-ui, sans-serif;
    --f-body: "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--f-body);
    display: grid; grid-template-rows: auto 1fr auto;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .75rem 1.25rem;
  }
  header a.brand { display: flex; align-items: center; gap: .6rem; color: var(--text); text-decoration: none; }
  header img { height: 36px; }
  header h1 { font-family: var(--f-display); font-weight: 600; font-size: 1rem; margin: 0; }
  .meta { display: flex; align-items: center; gap: 1rem; color: var(--muted); font-size: .9rem; }
  .meta a { color: var(--accent); }

  main { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #foto {
    max-width: 100%; max-height: 100%; object-fit: contain; display: block;
    user-select: none; -webkit-user-drag: none;
  }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 3.25rem; height: 3.25rem; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.45); color: #fff; cursor: pointer;
    display: grid; place-items: center;
  }
  .nav:hover { background: rgba(0,0,0,.7); }
  .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav:disabled { opacity: .25; cursor: default; }
  .nav svg { width: 1.5rem; height: 1.5rem; }
  #prev { left: 1rem; } #next { right: 1rem; }
  #pie {
    position: absolute; left: 50%; bottom: .75rem; transform: translateX(-50%);
    max-width: calc(100% - 8rem); margin: 0; padding: .35rem .8rem; border-radius: 4px;
    background: rgba(0,0,0,.55); font-family: var(--f-display); font-weight: 500;
    font-size: .95rem; text-align: center;
  }
  .estado { color: var(--muted); text-align: center; padding: 2rem; max-width: 40ch; }

  footer { overflow-x: auto; padding: .6rem 1rem; background: var(--panel); }
  #tiras { display: flex; gap: .4rem; }
  #tiras button {
    flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 4px;
    background: none; cursor: pointer; opacity: .55;
  }
  #tiras button[aria-current="true"] { border-color: var(--accent); opacity: 1; }
  #tiras button:focus-visible { outline: 2px solid var(--accent); }
  #tiras img { height: 56px; width: 80px; object-fit: cover; display: block; border-radius: 2px; }

  @media (max-width: 600px) {
    .nav { width: 2.6rem; height: 2.6rem; }
    #prev { left: .4rem; } #next { right: .4rem; }
    #tiras img { height: 44px; width: 62px; }
  }
</style>
</head>
<body data-pagefind-ignore="all">
<header>
  <a class="brand" href="/">
    <img src="/img/logo.png" alt="" onerror="this.remove()">
    <h1 id="titulo">Galería</h1>
  </a>
  <div class="meta">
    <span id="contador" aria-live="polite"></span>
    <a id="descargar" href="#" download hidden>Descargar</a>
  </div>
</header>

<main>
  <button class="nav" id="prev" aria-label="Foto anterior" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img id="foto" alt="" hidden>
  <p id="pie" hidden></p>
  <p class="estado" id="estado">Cargando fotos…</p>
  <button class="nav" id="next" aria-label="Foto siguiente" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</main>

<footer><div id="tiras"></div></footer>

<script>
(() => {
  // ── Configuración ───────────────────────────────────────
  const REPO = "neurofisio-usach/scn";
  const RAMA = "main";
  const EXT = /\.(jpe?g|png|webp|gif|avif)$/i;

  // Carpeta de esta página dentro del repo (ej. "galerias/congreso-2026-x7k2")
  const carpeta = decodeURIComponent(location.pathname).replace(/^\/|\/?(index\.html)?$/g, "");

  const $ = id => document.getElementById(id);
  const foto = $("foto"), prev = $("prev"), next = $("next");
  let fotos = [], i = 0;

  // "01 - Cerebro curioso.png" → "Cerebro curioso"
  const tituloDe = n => n.replace(EXT, "").replace(/^\d+\s*[-_.]\s*/, "").replace(/_/g, " ");
  const orden = (a, b) => a.localeCompare(b, "es", { numeric: true, sensitivity: "base" });

  // 1) Si existe images.json en la carpeta, se usa (permite fijar orden o títulos).
  // 2) Si no, se listan las imágenes de la carpeta con la API de GitHub.
  async function cargarLista() {
    try {
      const r = await fetch("images.json", { cache: "no-cache" });
      if (r.ok) {
        const j = await r.json();
        if (j.titulo) { $("titulo").textContent = j.titulo; document.title = j.titulo + " · SCN"; }
        return (j.imagenes || j).map(x => typeof x === "string"
          ? { archivo: x, titulo: tituloDe(x) }
          : { archivo: x.archivo, titulo: x.titulo || tituloDe(x.archivo) });
      }
    } catch (_) {}
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${carpeta}?ref=${RAMA}`);
    if (!r.ok) throw new Error("api " + r.status);
    const archivos = await r.json();
    return archivos.filter(f => f.type === "file" && EXT.test(f.name))
      .map(f => f.name).sort(orden)
      .map(n => ({ archivo: n, titulo: tituloDe(n) }));
  }

  function mostrar(n) {
    i = Math.max(0, Math.min(fotos.length - 1, n));
    const src = encodeURI(fotos[i].archivo);
    foto.src = src;
    foto.alt = fotos[i].titulo;
    $("pie").textContent = fotos[i].titulo;
    $("contador").textContent = `${i + 1} / ${fotos.length}`;
    $("descargar").href = src;
    prev.disabled = i === 0;
    next.disabled = i === fotos.length - 1;
    document.querySelectorAll("#tiras button").forEach((b, k) => {
      b.setAttribute("aria-current", k === i);
      if (k === i) b.scrollIntoView({ block: "nearest", inline: "center" });
    });
    history.replaceState(null, "", "#" + (i + 1));
    // Precargar vecinas para que la flecha sea instantánea
    [i - 1, i + 1].forEach(k => { if (fotos[k]) new Image().src = encodeURI(fotos[k].archivo); });
  }

  prev.onclick = () => mostrar(i - 1);
  next.onclick = () => mostrar(i + 1);
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") mostrar(i - 1);
    if (e.key === "ArrowRight") mostrar(i + 1);
    if (e.key === "Home") mostrar(0);
    if (e.key === "End") mostrar(fotos.length - 1);
  });

  // Deslizar con el dedo en el celular
  let x0 = null;
  foto.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  foto.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) mostrar(i + (dx < 0 ? 1 : -1));
    x0 = null;
  });

  cargarLista().then(lista => {
    fotos = lista;
    if (!fotos.length) { $("estado").textContent = "Esta carpeta todavía no tiene fotos."; return; }
    $("estado").remove();
    [foto, prev, next, $("pie"), $("descargar")].forEach(el => el.hidden = false);
    const tiras = $("tiras");
    fotos.forEach((f, k) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", f.titulo);
      b.title = f.titulo;
      b.innerHTML = `<img loading="lazy" alt="" src="${encodeURI(f.archivo)}">`;
      b.onclick = () => mostrar(k);
      tiras.appendChild(b);
    });
    const desdeHash = parseInt(location.hash.slice(1), 10);
    mostrar(Number.isFinite(desdeHash) ? desdeHash - 1 : 0);
  }).catch(() => {
    $("estado").textContent = "No se pudo cargar la lista de fotos. Recarga la página en un momento.";
  });
})();
</script>
</body>
</html>
