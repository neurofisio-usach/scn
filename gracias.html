<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensaje enviado — Sociedad Chilena de Neurociencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:#0c1e3f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;-webkit-font-smoothing:antialiased}
:root{--teal:#0d9fa0;--f-serif:'DM Serif Display',Georgia,serif}
.icon{font-size:3.5rem;margin-bottom:1.5rem}
h1{font-family:var(--f-serif);font-weight:400;font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:1rem;line-height:1.2}
p{font-size:.95rem;color:rgba(255,255,255,.62);line-height:1.75;max-width:480px;margin-bottom:.5rem}
.links{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:2.5rem}
.btn{display:inline-block;padding:.65rem 1.4rem;border-radius:4px;font-size:.88rem;font-weight:600;text-decoration:none;transition:opacity .15s}
.btn-primary{background:var(--teal);color:#fff}
.btn-ghost{border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8)}
.btn:hover{opacity:.82}
</style>
</head>
<body>
  <div class="icon">✅</div>
  <h1>¡Mensaje recibido!</h1>
  <p>Gracias por contactarnos. Hemos recibido tu mensaje y te responderemos a la brevedad al correo que indicaste.</p>
  <p style="font-size:.82rem;color:rgba(255,255,255,.38)">Si enviaste una solicitud de incorporación, el Directorio la revisará en la próxima sesión (máximo 60 días hábiles).</p>
  <div class="links">
    <a href="index.html" class="btn btn-primary">← Volver al inicio</a>
    <a href="asociarse.html" class="btn btn-ghost">Membresía SCN</a>
  </div>
</body>
</html>
